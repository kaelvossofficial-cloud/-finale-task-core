name: Finale Task Core Android CI/CD

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Test & Build Android SDK 34+ Release (APK & AAB)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter Stable
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Verify Static Analysis
        run: flutter analyze --no-fatal-infos

      - name: Execute Unit & Widget Test Suites
        run: flutter test --reporter expanded

      - name: Build Android Release APK (Target SDK 34+)
        run: flutter build apk --release

      - name: Build Android App Bundle (AAB)
        run: flutter build appbundle --release

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: finale-task-core-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Upload Release AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: finale-task-core-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Create and Publish GitHub Release with APK & AAB
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v1.0.0' }}
          name: "Finale Task Core ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v1.0.0' }} - Android Release"
          body: |
            ### ⛏️ Finale Task Core - Android SDK 34+ Release
            
            **Highlights & Features:**
            - **Cupertino-First iOS HIG Ergonomics (60/120fps)** running natively on Android SDK 34+.
            - **Minecraft Pixel-Art & Voxel Styling**: 8x8 custom sprite painters, 3D beveled voxel cards, and segmented XP/ritual progress bars.
            - **Tactile Dismiss Gesture**: Interactive slide-to-mine gesture replacing static checkboxes with spring simulation and haptic feedback.
            - **Gamification Engine**: $+10\text{ XP}$ per task mined and $+5\text{ XP}$ on-time completion bonus.
            - **Progression & Stats**: Dynamic Leveling engine ($\text{Level} = \lfloor\sqrt{\text{XP} / 100}\rfloor + 1$).
            - **Habit Tracker**: Daily streak tracking with configurable grace periods.
            - **Data Management**: Full offline SQLite persistence with JSON snapshot backup & restore.
            
            #### 📦 Release Assets
            - **APK (`app-release.apk`)**: Standalone APK for sideloading and manual installation on Android devices.
            - **AAB (`app-release.aab`)**: Android App Bundle ready for Google Play Console submission.
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
          prerelease: false
