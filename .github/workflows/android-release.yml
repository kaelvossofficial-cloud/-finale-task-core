name: Finale Task Core Android CI/CD

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Test & Build Android SDK 34+ Release (APK & AAB)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter Stable
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Verify Static Analysis
        run: flutter analyze --no-fatal-infos

      - name: Execute Unit & Widget Test Suites
        run: flutter test --reporter expanded

      - name: Build Android Release APK (Target SDK 34+)
        run: flutter build apk --release

      - name: Build Android App Bundle (AAB)
        run: flutter build appbundle --release

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: finale-task-core-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Upload Release AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: finale-task-core-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Create and Publish GitHub Release with APK & AAB
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          tag_name: ${{ github.ref_name }}
          name: "Finale Task Core ${{ github.ref_name }}"
          body: |
            ### ⛏️ Finale Task Core ${{ github.ref_name }}

            - **APK** (`app-release.apk`): install directly on Android 7+ (target SDK 34+).
            - **AAB** (`app-release.aab`): upload to Google Play Console.

            See the commit history for what changed.
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
          prerelease: false
